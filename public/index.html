<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>invoice-nudge</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f6f7f9; color:#1a1a1e; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing:-0.4px; }
  .tag { color:#6b7280; font-size:13px; margin-bottom:22px; }
  .card { background:#fff; border:1px solid #e6e8ec; border-radius:14px; padding:18px; margin-bottom:18px; }
  .card h2 { font-size:14px; margin:0 0 14px; }
  form { display:grid; grid-template-columns: 1fr 1fr; gap:10px 12px; }
  label { font-size:12px; color:#6b7280; font-weight:600; display:block; margin-bottom:4px; }
  input { width:100%; padding:9px 10px; border:1px solid #d8dbe0; border-radius:8px; font-size:14px; }
  input:focus { outline:none; border-color:#6366f1; }
  .full { grid-column: 1 / -1; }
  button { background:#4f46e5; color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:#4338ca; }
  button.ghost { background:#fff; color:#4f46e5; border:1px solid #c7c9f2; }
  button.tiny { padding:5px 10px; font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:10px 8px; border-bottom:1px solid #f0f1f3; font-size:13px; }
  th { color:#6b7280; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.3px; }
  .pill { font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; }
  .unpaid { background:#fef3c7; color:#92400e; }
  .paid { background:#dcfce7; color:#166534; }
  .overdue { color:#dc2626; font-weight:700; }
  .empty { color:#9aa0a6; font-size:13px; padding:14px 0; }
  .row-actions { display:flex; gap:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧾 invoice-nudge</h1>
  <div class="tag">Register an invoice. We send the polite "any update on payment?" email so you never have to.</div>

  <div class="card">
    <h2>Add an invoice</h2>
    <form id="f">
      <div><label>Client name</label><input name="clientName" placeholder="Acme Co." /></div>
      <div><label>Client email *</label><input name="clientEmail" type="email" placeholder="billing@acme.com" required /></div>
      <div><label>Amount *</label><input name="amount" type="number" step="0.01" placeholder="500" required /></div>
      <div><label>Currency</label><input name="currency" placeholder="USD" value="USD" /></div>
      <div><label>Invoice #</label><input name="invoiceNumber" placeholder="INV-001" /></div>
      <div><label>Due date *</label><input name="dueDate" type="date" required /></div>
      <div class="full"><button type="submit">Add invoice</button></div>
    </form>
  </div>

  <div class="card">
    <h2>Invoices</h2>
    <table id="t">
      <thead>
        <tr><th>Client</th><th>Amount</th><th>Due</th><th>Status</th><th>Reminders</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none;">No invoices yet. Add one above ↑</div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);

function fmtMoney(a, c) { return (c || "USD") + " " + Number(a).toLocaleString(); }
function isOverdue(inv) { return inv.status !== "paid" && new Date(inv.dueDate) < new Date(new Date().toISOString().slice(0,10)); }

async function load() {
  const list = await fetch("/api/invoices").then(r => r.json());
  const rows = $("#rows");
  rows.innerHTML = "";
  $("#empty").style.display = list.length ? "none" : "block";
  list.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));
  for (const inv of list) {
    const tr = document.createElement("tr");
    const due = isOverdue(inv) ? `<span class="overdue">${inv.dueDate}</span>` : inv.dueDate;
    const status = inv.status === "paid"
      ? `<span class="pill paid">PAID</span>`
      : `<span class="pill unpaid">UNPAID</span>`;
    tr.innerHTML = `
      <td>${inv.clientName || "—"}<br><span style="color:#9aa0a6;font-size:11px">${inv.clientEmail}</span></td>
      <td>${fmtMoney(inv.amount, inv.currency)}</td>
      <td>${due}</td>
      <td>${status}</td>
      <td>${inv.reminderCount || 0}×</td>
      <td><div class="row-actions">
        ${inv.status === "paid"
          ? `<button class="ghost tiny" data-act="unpaid" data-id="${inv.id}">Mark unpaid</button>`
          : `<button class="tiny" data-act="paid" data-id="${inv.id}">Mark paid</button>`}
        <button class="ghost tiny" data-act="del" data-id="${inv.id}">Delete</button>
      </div></td>`;
    rows.appendChild(tr);
  }
}

$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  const r = await fetch("/api/invoices", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(data) });
  if (r.ok) { e.target.reset(); e.target.currency.value = "USD"; load(); }
  else { const j = await r.json(); alert(j.error || "Error"); }
});

$("#rows").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const { act, id } = btn.dataset;
  if (act === "del") { await fetch("/api/invoices/" + id, { method:"DELETE" }); }
  else { await fetch("/api/invoices/" + id, { method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ status: act }) }); }
  load();
});

load();
</script>
</body>
</html>
